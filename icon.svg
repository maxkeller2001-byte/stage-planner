<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Gemeinsames Format der Schießsport-Apps (Maßstab Zero & Score): Grund #0A0A0A, Zeichen in Signalorange #FF6A13,
       Zeichen 60 % der Kante. Die abgerundete Kachel gilt für Browser, Kopfzeile und Windows;
       tools/make-icons.mjs nimmt für Android nur das Zeichen (Gruppe id="mark") auf eigenem Grund. -->
  <defs><clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath></defs>
  <g clip-path="url(#r)"><rect width="512" height="512" fill="#0A0A0A"/></g>
  <!-- Nur die IPSC-Scheibe, alle Wertungsgrenzen als Linie: Umriss (D-Zone), C-Zone, A-Zone – Maße wie in der App, ohne Füllung -->
  <g id="mark" transform="translate(256 256) scale(530)" fill="none" stroke="#FF6A13" stroke-linejoin="round">
    <path d="M-.078-.29H.078L.23-.105V.095L.078.29H-.078L-.23.095V-.105Z" stroke-width=".0283"/>
    <path d="M-.078-.29H.078L.149-.1V.043L.053.163H-.053L-.149.043V-.1Z" stroke-width=".0189"/>
    <path d="M-.04-.255H.04L.08-.12V-.03L.032.06H-.032L-.08-.03V-.12Z" stroke-width=".0189"/>
  </g>
</svg>
